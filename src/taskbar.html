<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>任务栏</title>
  <link rel="stylesheet" href="dashboard.css">
  <style>
    /* 独立任务栏窗口：窗口尺寸即任务栏尺寸，任务栏铺满窗口 */
    html,
    body {
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    /* dashboard.css has a more-specific bright-theme body background. Keep
       the transparent parts of this independent window transparent in both
       themes so its margins show the desktop wallpaper underneath. */
    html.taskbar-window,
    body.taskbar-window,
    body.taskbar-window.theme-bright {
      background: transparent !important;
      background-color: transparent !important;
      background-image: none !important;
    }

    /* 独立窗口必须遮住 Explorer 原任务栏，避免其图标从毛玻璃层透出。 */
    body.taskbar-window .taskbar {
      background: rgb(30, 30, 30);
    }

    body.taskbar-window.theme-bright .taskbar {
      background: rgb(245, 245, 245);
    }

    body.taskbar-floating .taskbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      height: auto;
      transform: none;
      border-radius: 12px;
    }

    body.taskbar-docked .taskbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      width: auto;
      height: auto;
      transform: none;
      border-radius: 0;
    }
  </style>
</head>
<body class="taskbar-window taskbar-floating">
  <!-- 独立始终置顶任务栏（盖在屏幕底部真实任务栏位置） -->
  <div id="taskbar" class="taskbar floating">
    <!-- 开始按钮 -->
    <div class="start-btn" id="start-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <rect x="2" y="2" width="9" height="9" rx="1"/>
        <rect x="13" y="2" width="9" height="9" rx="1"/>
        <rect x="2" y="13" width="9" height="9" rx="1"/>
        <rect x="13" y="13" width="9" height="9" rx="1"/>
      </svg>
    </div>

    <!-- 运行中窗口（前台程序） -->
    <div class="taskbar-windows" id="taskbar-windows"></div>

    <!-- 时间显示 -->
    <div class="taskbar-time-container">
      <!-- 有新消息时显示在时间左侧的铃铛（仅指示，点击时间按钮打开消息面板） -->
      <span class="taskbar-msg-indicator" id="taskbar-msg-indicator" title="有新消息" style="display:none">
        <svg viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 22c1.1 0 2-.9 2-2h-4c0 1.1.9 2 2 2zm6-6v-5c0-3.07-1.63-5.64-4.5-6.32V4c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v.68C7.64 5.36 6 7.92 6 11v5l-2 2v1h16v-1l-2-2z"/>
        </svg>
        <span class="taskbar-msg-dot"></span>
      </span>
      <!-- 控制中心图标（Windows 11 风格：三图标合一按钮） -->
      <button class="control-center-btn" id="btn-control-center" title="网络、音量、电池">
        <svg viewBox="0 0 24 24" fill="currentColor" title="网络">
          <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
        </svg>
        <svg viewBox="0 0 24 24" fill="currentColor" title="音量">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
        </svg>
        <svg viewBox="0 0 24 24" fill="currentColor" title="电池" id="cc-battery-icon">
          <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
        </svg>
      </button>
      <button class="taskbar-time-btn" id="taskbar-time-btn">
        <div class="time-display" id="time-display"></div>
        <div class="date-display" id="date-display"></div>
      </button>
    </div>
  </div>

  <script src="taskbar.js"></script>
</body>
</html>
