<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>开始菜单</title>
  <link rel="stylesheet" href="start-menu.css">
</head>
<body>
  <!-- 独立置顶开始菜单窗口（悬浮于所有窗口之上） -->
  <div id="start-menu" class="start-menu">
    <!-- 用户信息区域 -->
    <div class="start-menu-user">
      <div class="user-avatar" id="start-menu-avatar">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <div class="user-info">
        <div class="user-name" id="start-menu-username">用户</div>
        <div class="user-status">已登录</div>
      </div>
      <button class="user-menu-btn" id="user-menu-btn" title="账户">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <div class="user-submenu hidden" id="user-submenu">
        <button class="user-submenu-item" id="start-menu-lock">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 10c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span>锁定</span>
        </button>
        <button class="user-submenu-item" id="start-menu-logout">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5z"/>
          </svg>
          <span>注销</span>
        </button>
      </div>
    </div>

    <!-- 分隔线 -->
    <div class="start-menu-divider"></div>

    <!-- 所有应用区域 -->
    <div class="start-menu-apps">
      <div class="start-menu-section-title">所有应用</div>
      <div class="start-menu-app-list" id="start-menu-app-list">
        <!-- 动态填充 -->
      </div>
    </div>

    <!-- 分隔线 -->
    <div class="start-menu-divider"></div>

    <!-- 电源按钮区域 -->
    <div class="start-menu-power">
      <div class="power-menu-container">
        <button class="power-btn-main" id="power-btn-main" title="电源选项">⏻</button>
        <!-- 电源弹出菜单 -->
        <div class="power-submenu hidden" id="power-submenu">
          <button class="power-submenu-item" id="start-menu-shutdown">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
            </svg>
            <span>关机</span>
          </button>
          <button class="power-submenu-item" id="start-menu-restart">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            <span>重新启动</span>
          </button>
          <button class="power-submenu-item" id="start-menu-shell">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 19V7H4v12h16m0-16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16m-7 14v-2h5v2h-5m-3.42-4L5 11l4-4 4 4-4.58 2.58"/>
            </svg>
            <span>Shell模式</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- 模态确认弹窗 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="modal-message" class="modal-message"></div>
      <div class="modal-buttons">
        <button id="modal-btn-cancel" class="modal-btn modal-btn-cancel">取消</button>
        <button id="modal-btn-confirm" class="modal-btn modal-btn-confirm">确定</button>
      </div>
    </div>
  </div>

  <script src="start-menu.js"></script>
</body>
</html>
