<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>登录</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <!-- 登录容器 -->
    <div id="login-container">
      <div class="login-box">
        <!-- 用户头像 -->
        <div class="user-avatar">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <!-- 用户名显示 -->
        <div id="username-display" class="username"></div>
        <!-- 密码输入区域 -->
        <div id="password-section">
          <input type="password" id="password-input" placeholder="请输入密码" />
          <!-- 密码显示/隐藏切换按钮 -->
          <button id="toggle-password" class="toggle-btn">
            <svg id="eye-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
        <!-- 登录按钮 -->
        <button id="login-btn" class="login-btn">
          <span class="btn-text">→</span>
          <span class="btn-loader hidden"></span>
        </button>
        <!-- 错误信息显示 -->
        <div id="error-msg" class="error-msg"></div>
        <!-- 选项区域（背景更改按钮已隐藏） -->
        <div class="options" style="display: none;">
          <button id="change-bg-btn" class="small-btn">更换背景</button>
        </div>
      </div>
    </div>
    <!-- 用户选择面板 -->
    <div id="users-panel" class="users-panel hidden">
      <div class="users-header">选择用户</div>
      <div id="users-list" class="users-list"></div>
    </div>
    <!-- 遮罩确认窗 -->
    <div id="modal-overlay" class="modal-overlay hidden">
      <div class="modal-box">
        <div id="modal-message" class="modal-message"></div>
        <div class="modal-buttons">
          <button id="modal-btn-cancel" class="modal-btn modal-btn-cancel">取消</button>
          <button id="modal-btn-confirm" class="modal-btn modal-btn-confirm">确定</button>
        </div>
      </div>
    </div>
    <!-- 电源按钮弹出菜单 -->
    <div id="power-menu" class="power-menu hidden">
      <div class="power-menu-item" id="btn-shutdown">
        <svg viewBox="0 0 24 24" fill="currentColor" class="power-menu-icon">
          <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
        </svg>
        <span>关机</span>
      </div>
      <div class="power-menu-item" id="btn-restart">
        <svg viewBox="0 0 24 24" fill="currentColor" class="power-menu-icon">
          <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
        </svg>
        <span>重新启动</span>
      </div>
      <div class="power-menu-item" id="btn-shell">
        <svg viewBox="0 0 24 24" fill="currentColor" class="power-menu-icon">
          <path d="M20 19V7H4v12h16m0-16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16m-7 14v-2h5v2h-5m-3.42-4L5 11l4-4 4 4-4.58 2.58"/>
        </svg>
        <span>Shell模式</span>
      </div>
    </div>
    <!-- 底部栏 -->
    <div class="bottom-bar">
      <div class="left-controls">
        <button class="control-btn" id="power-btn" title="电源">⏻</button>
        <button class="control-btn" id="switch-user-btn" title="切换用户">
          <!-- 切换用户图标 - 用户图标 -->
          <svg viewBox="0 0 24 24" fill="currentColor" class="icon">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </button>
      </div>
      <!-- 时间日期显示 -->
      <div class="datetime">
        <div id="time"></div>
        <div id="date"></div>
      </div>
    </div>
    <script src="renderer.js"></script>
  </body>
</html>
