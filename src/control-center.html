<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>控制中心</title>
  <link rel="stylesheet" href="control-center.css">
</head>
<body>
  <div id="control-center" class="control-center">
    <!-- 初始加载遮罩 -->
    <div id="center-loading" class="center-loading">
      <div class="spinner"></div>
      <span>正在加载…</span>
    </div>

    <!-- 主视图 -->
    <div id="view-main" class="view">
      <div class="quick-settings">
        <div class="settings-grid">
          <button class="setting-btn" id="btn-network" data-toggle="network" title="网络">
            <svg viewBox="0 0 24 24" fill="currentColor" class="setting-icon">
              <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
            </svg>
            <span class="setting-label">网络</span>
            <span class="setting-value" id="network-value">选择网络</span>
          </button>

          <button class="setting-btn" id="btn-bluetooth" title="蓝牙">
            <svg viewBox="0 0 24 24" fill="currentColor" class="setting-icon">
              <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
            </svg>
            <span class="setting-label">蓝牙</span>
            <span class="setting-value" id="bluetooth-value">选择设备</span>
          </button>

          <button class="setting-btn" id="btn-flight-mode" title="飞行模式">
            <svg viewBox="0 0 24 24" fill="currentColor" class="setting-icon">
              <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/>
            </svg>
            <span class="setting-label">飞行模式</span>
            <span class="setting-value" id="flight-mode-value">…</span>
          </button>
        </div>

        <div class="settings-grid">
          <button class="setting-btn" id="btn-hotspot" title="移动热点">
            <svg viewBox="0 0 24 24" fill="currentColor" class="setting-icon">
              <path d="M12 11c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6 2c0-3.31-2.69-6-6-6s-6 2.69-6 6c0 2.22 1.21 4.15 3 5.19l1-1.74c-1.19-.7-2-1.97-2-3.45 0-2.21 1.79-4 4-4s4 1.79 4 4c0 1.48-.81 2.75-2 3.45l1 1.74c1.79-1.04 3-2.97 3-5.19zM12 3C6.48 3 2 7.48 2 13c0 3.7 2.01 6.92 4.99 8.65l1-1.73C5.61 18.53 4 15.96 4 13c0-4.42 3.58-8 8-8s8 3.58 8 8c0 2.96-1.61 5.53-4 6.92l1 1.73c2.99-1.73 5-4.95 5-8.65 0-5.52-4.48-10-10-10z"/>
            </svg>
            <span class="setting-label">移动热点</span>
            <span class="setting-value" id="hotspot-value">…</span>
          </button>
        </div>

        <div class="slider-section">
          <div class="slider-item" id="brightness-item">
            <div class="slider-header">
              <svg viewBox="0 0 24 24" fill="currentColor" class="slider-icon">
                <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>
              </svg>
              <span class="slider-label">亮度</span>
            </div>
            <div class="slider-container">
              <input type="range" id="brightness-slider" min="0" max="100" value="50" class="slider">
              <span class="slider-value" id="brightness-value">50%</span>
            </div>
          </div>

          <div class="slider-item" id="volume-item">
            <div class="slider-header">
              <svg viewBox="0 0 24 24" fill="currentColor" class="slider-icon">
                <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
              </svg>
              <span class="slider-label">音量</span>
            </div>
            <div class="slider-container">
              <input type="range" id="volume-slider" min="0" max="100" value="50" class="slider">
              <span class="slider-value" id="volume-value">50%</span>
              <button id="btn-volume-mute" class="mixer-btn" title="静音/取消静音" aria-label="静音/取消静音">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
              </button>
              <button id="btn-volume-mixer" class="mixer-btn" title="打开自制音量合成器面板" aria-label="打开自制音量合成器面板">
                <svg viewBox="0 0 24 24" fill="currentColor">
                  <path d="M3 17v2h6v-2H3zM3 5v2h10V5H3zm10 16v-2h8v-2h-8v-2h-2v6h2zM7 9v2H3v2h4v2h2V9H7zm14 4v-2H11v2h10zm-6-4h2V7h4V5h-4V3h-2v6z"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <div class="battery-section">
          <svg viewBox="0 0 24 24" fill="currentColor" class="battery-icon">
            <path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/>
          </svg>
          <span class="battery-text" id="battery-text">100%</span>
        </div>
      </div>
    </div>

    <!-- 自制音量合成器视图 -->
    <div id="view-mixer" class="view hidden">
      <div class="mixer-header">
        <button id="btn-mixer-back" class="mixer-icon-btn" title="返回">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>
        <span class="mixer-title">音量合成器</span>
        <button id="btn-mixer-refresh" class="mixer-icon-btn" title="刷新">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>

      <div class="device-selector">
        <button id="btn-device-toggle" class="device-toggle" title="输出设备选择">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
          <span id="device-name" class="device-name">输出设备</span>
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6-6-6 1.41-1.41z"/>
          </svg>
        </button>
        <div id="device-dropdown" class="device-dropdown hidden"></div>
      </div>

      <div id="sessions-list" class="sessions-list">
        <div class="sessions-status"><div class="spinner"></div><span>正在读取音频会话…</span></div>
      </div>
      <div id="mixer-error" class="mixer-error hidden"></div>
    </div>

    <!-- 网络选择视图 -->
    <div id="view-network" class="view hidden">
      <div class="mixer-header">
        <button id="btn-network-back" class="mixer-icon-btn" title="返回">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>
        <span class="mixer-title">网络</span>
        <button id="btn-network-refresh" class="mixer-icon-btn" title="刷新">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>

      <div class="net-status-card" id="network-status-card">
        <div class="net-status-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M1 9l2 2c4.97-4.97 13.03-4.97 18 0l2-2C16.93 2.93 7.08 2.93 1 9zm8 8l3 3 3-3c-1.65-1.66-4.34-1.66-6 0zm-4-4l2 2c2.76-2.76 7.24-2.76 10 0l2-2C15.14 9.14 8.87 9.14 5 13z"/>
          </svg>
        </div>
        <div class="net-status-info">
          <span class="net-status-title" id="network-status-title">正在获取状态…</span>
          <span class="net-status-sub" id="network-status-sub">—</span>
        </div>
        <button class="toggle-switch" id="btn-wifi-power" title="WiFi 开关（控制软件无线电，与 Windows 系统开关等效；不会禁用网卡）"></button>
      </div>

      <div class="section-title">可用网络</div>
      <div id="wifi-list" class="sessions-list"></div>
      <div id="network-error" class="mixer-error hidden"></div>
      <div id="network-op-status" class="network-op-status hidden"></div>
    </div>

    <!-- 蓝牙选择视图 -->
    <div id="view-bluetooth" class="view hidden">
      <div class="mixer-header">
        <button id="btn-bluetooth-back" class="mixer-icon-btn" title="返回">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/>
          </svg>
        </button>
        <span class="mixer-title">蓝牙</span>
        <button id="btn-bluetooth-refresh" class="mixer-icon-btn" title="刷新">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
          </svg>
        </button>
      </div>

      <div class="net-status-card" id="bluetooth-status-card">
        <div class="net-status-icon">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17.71 7.71L12 2h-1v7.59L6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 11 14.41V22h1l5.71-5.71-4.3-4.29 4.3-4.29zM13 5.83l1.88 1.88L13 9.59V5.83zm1.88 10.46L13 18.17v-3.76l1.88 1.88z"/>
          </svg>
        </div>
        <div class="net-status-info">
          <span class="net-status-title" id="bluetooth-status-title">正在获取状态…</span>
          <span class="net-status-sub" id="bluetooth-status-sub">—</span>
        </div>
        <button class="toggle-switch" id="btn-bt-power" title="蓝牙开关"></button>
      </div>

      <div class="section-title" id="bluetooth-section-title">已配对设备</div>
      <div id="bluetooth-list" class="sessions-list"></div>
      <div id="bluetooth-error" class="mixer-error hidden"></div>
      <div id="bluetooth-op-status" class="network-op-status hidden"></div>
      <button id="btn-bt-show-all" class="btn-small btn-show-all">显示所有设备</button>
    </div>
  </div>

  <!-- 右键菜单 -->
  <div id="context-menu" class="context-menu hidden"></div>

  <!-- 通用确认弹窗 -->
  <div id="confirm-modal" class="cc-modal hidden">
    <div class="cc-modal-box">
      <span id="confirm-modal-title" class="cc-modal-title"></span>
      <div class="cc-modal-actions">
        <button id="confirm-modal-cancel" class="btn-small">取消</button>
        <button id="confirm-modal-ok" class="btn-small btn-danger">确认</button>
      </div>
    </div>
  </div>

  <!-- 配对码弹窗 -->
  <div id="pair-modal" class="cc-modal hidden">
    <div class="cc-modal-box">
      <span class="cc-modal-title">输入配对码</span>
      <span id="pair-modal-device" class="cc-modal-sub"></span>
      <input id="pair-modal-input" class="cc-modal-input" type="password" placeholder="配对码（如 0000）">
      <div class="cc-modal-actions">
        <button id="pair-modal-cancel" class="btn-small">取消</button>
        <button id="pair-modal-ok" class="btn-small">确认</button>
      </div>
    </div>
  </div>

  <!-- 属性弹窗 -->
  <div id="props-modal" class="cc-modal hidden">
    <div class="cc-modal-box">
      <span id="props-modal-title" class="cc-modal-title"></span>
      <div id="props-modal-body" class="cc-modal-body"></div>
      <div class="cc-modal-actions">
        <button id="props-modal-close" class="btn-small">关闭</button>
      </div>
    </div>
  </div>

  <script src="control-center.js"></script>
</body>
</html>
