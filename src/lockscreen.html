<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>锁定</title>
    <link rel="stylesheet" href="index.css" />
  </head>
  <body>
    <div id="login-container">
      <div class="login-box">
        <div class="user-avatar">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
        </div>
        <div id="username-display" class="username"></div>
        <div id="password-section">
          <input type="password" id="password-input" placeholder="请输入密码" />
          <button id="toggle-password" class="toggle-btn">
            <svg id="eye-icon" viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
          </button>
        </div>
        <button id="login-btn" class="login-btn">
          <span class="btn-text">→</span>
          <span class="btn-loader hidden"></span>
        </button>
        <div id="error-msg" class="error-msg"></div>
        <div class="options" style="display: none;">
          <button id="change-bg-btn" class="small-btn">更换背景</button>
        </div>
      </div>
    </div>
    <div class="bottom-bar">
      <div class="left-controls"></div>
      <div class="datetime">
        <div id="time"></div>
        <div id="date"></div>
      </div>
    </div>
    <script src="lockscreen.js"></script>
  </body>
</html>
