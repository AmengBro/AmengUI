<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欢迎</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <h1>欢迎回来！</h1>
    <p id="welcome-user"></p>
  </div>
  
  <!-- 任务栏 -->
  <div id="taskbar" class="taskbar floating">
    <!-- 开始按钮 -->
    <div class="start-btn" id="start-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <rect x="2" y="2" width="9" height="9" rx="1"/>
        <rect x="13" y="2" width="9" height="9" rx="1"/>
        <rect x="2" y="13" width="9" height="9" rx="1"/>
        <rect x="13" y="13" width="9" height="9" rx="1"/>
      </svg>
    </div>
    
    <!-- 时间显示 -->
    <div class="taskbar-time-container">
      <!-- 控制中心图标 -->
      <div class="control-center-icons">
        <button class="control-icon-btn" id="btn-network-icon" title="网络">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 3C7.46 3 3.34 4.78.29 7.67c-.18.18-.29.43-.29.71 0 .28.11.53.29.71l10 10c.39.39 1.02.39 1.41 0l10-10c.18-.18.29-.43.29-.71 0-.28-.11-.53-.29-.71C20.66 4.78 16.54 3 12 3zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8z"/>
          </svg>
        </button>
        <button class="control-icon-btn" id="btn-volume-icon" title="音量">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
          </svg>
        </button>
        <button class="control-icon-btn" id="btn-battery-icon" title="电池">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 6H7c-1.1 0-2 .9-2 2v8c0 1.1.9 2 2 2h10c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 10H7V8h10v8zm3-12v14h1V4h-1z"/>
          </svg>
        </button>
      </div>
      <button class="taskbar-time-btn" id="taskbar-time-btn">
        <div class="time-display" id="time-display"></div>
        <div class="date-display" id="date-display"></div>
      </button>
      <!-- 日历弹窗 -->
      <div class="calendar-popup hidden" id="calendar-popup">
        <!-- 日期标题区域 -->
        <div class="calendar-header">
          <div class="calendar-date-info">
            <div class="calendar-date-main" id="calendar-date-main"></div>
            <div class="calendar-date-lunar" id="calendar-date-lunar"></div>
          </div>
          <div class="calendar-time" id="calendar-time"></div>
        </div>
        
        <!-- 月份导航 -->
        <div class="calendar-nav">
          <button class="calendar-nav-btn" id="calendar-prev-month">‹</button>
          <div class="calendar-month-year" id="calendar-month-year"></div>
          <button class="calendar-nav-btn" id="calendar-next-month">›</button>
        </div>
        
        <!-- 星期标题 -->
        <div class="calendar-weekdays">
          <span>一</span>
          <span>二</span>
          <span>三</span>
          <span>四</span>
          <span>五</span>
          <span>六</span>
          <span>日</span>
        </div>
        
        <!-- 日期格子 -->
        <div class="calendar-days" id="calendar-days"></div>
      </div>
    </div>
  </div>
  
  <!-- 开始菜单 -->
  <div id="start-menu" class="start-menu hidden">
    <!-- 用户信息区域 -->
    <div class="start-menu-user">
      <div class="user-avatar">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <div class="user-info">
        <div class="user-name" id="start-menu-username">用户</div>
        <div class="user-status">已登录</div>
      </div>
      <button class="user-menu-btn" id="user-menu-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
      <div class="user-submenu hidden" id="user-submenu">
        <button class="user-submenu-item" id="start-menu-lock">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3zm0 10c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
          </svg>
          <span>锁定</span>
        </button>
        <button class="user-submenu-item" id="start-menu-logout">
          <svg viewBox="0 0 24 24" fill="currentColor">
            <path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5z"/>
          </svg>
          <span>注销</span>
        </button>
      </div>
    </div>
    
    <!-- 分隔线 -->
    <div class="start-menu-divider"></div>
    
    <!-- 常用应用区域 -->
    <div class="start-menu-apps">
      <div class="start-menu-section-title">所有应用</div>
      <div class="start-menu-app-list" id="start-menu-app-list">
        <!-- 动态填充 -->
      </div>
    </div>
    
    <!-- 分隔线 -->
    <div class="start-menu-divider"></div>
    
    <!-- 电源按钮区域 -->
    <div class="start-menu-power">
      <!-- 电源按钮 -->
      <div class="power-menu-container">
        <button class="power-btn-main" id="power-btn-main" title="电源选项">⏻</button>
        <!-- 电源弹出菜单 -->
        <div class="power-submenu hidden" id="power-submenu">
          <button class="power-submenu-item" id="start-menu-shutdown">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
            </svg>
            <span>关机</span>
          </button>
          <button class="power-submenu-item" id="start-menu-restart">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            <span>重新启动</span>
          </button>
          <button class="power-submenu-item" id="start-menu-shell">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 19V7H4v12h16m0-16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16m-7 14v-2h5v2h-5m-3.42-4L5 11l4-4 4 4-4.58 2.58"/>
            </svg>
            <span>Shell模式</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="dashboard.js"></script>
  
  <!-- 模态确认弹窗 -->
  <div id="modal-overlay" class="modal-overlay hidden">
    <div class="modal-box">
      <div id="modal-message" class="modal-message"></div>
      <div class="modal-buttons">
        <button id="modal-btn-cancel" class="modal-btn modal-btn-cancel">取消</button>
        <button id="modal-btn-confirm" class="modal-btn modal-btn-confirm">确定</button>
      </div>
    </div>
  </div>
</body>
</html>
