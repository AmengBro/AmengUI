<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>欢迎</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <div class="container">
    <h1>欢迎回来！</h1>
    <p id="welcome-user"></p>
    <div class="theme-toggle">
      <button id="toggle-theme-btn">切换主题</button>
      <button id="toggle-taskbar-btn">切换任务栏模式</button>
      <button id="test-btn">测试按钮</button>
    </div>
    <p class="hint">按 ESC 键关闭此页面</p>
  </div>
  
  <!-- 任务栏 -->
  <div id="taskbar" class="taskbar floating">
    <!-- 开始按钮 -->
    <div class="start-btn" id="start-btn">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <rect x="2" y="2" width="9" height="9" rx="1"/>
        <rect x="13" y="2" width="9" height="9" rx="1"/>
        <rect x="2" y="13" width="9" height="9" rx="1"/>
        <rect x="13" y="13" width="9" height="9" rx="1"/>
      </svg>
    </div>
    
    <!-- 时间显示 -->
    <div class="taskbar-time-container">
      <button class="taskbar-time-btn" id="taskbar-time-btn">
        <div class="time-display" id="time-display"></div>
        <div class="date-display" id="date-display"></div>
      </button>
      <!-- 日历弹窗 -->
      <div class="calendar-popup hidden" id="calendar-popup">
        <!-- 日期标题区域 -->
        <div class="calendar-header">
          <div class="calendar-date-info">
            <div class="calendar-date-main" id="calendar-date-main"></div>
            <div class="calendar-date-lunar" id="calendar-date-lunar"></div>
          </div>
          <div class="calendar-time" id="calendar-time"></div>
        </div>
        
        <!-- 月份导航 -->
        <div class="calendar-nav">
          <button class="calendar-nav-btn" id="calendar-prev-month">‹</button>
          <div class="calendar-month-year" id="calendar-month-year"></div>
          <button class="calendar-nav-btn" id="calendar-next-month">›</button>
        </div>
        
        <!-- 星期标题 -->
        <div class="calendar-weekdays">
          <span>一</span>
          <span>二</span>
          <span>三</span>
          <span>四</span>
          <span>五</span>
          <span>六</span>
          <span>日</span>
        </div>
        
        <!-- 日期格子 -->
        <div class="calendar-days" id="calendar-days"></div>
      </div>
    </div>
  </div>
  
  <!-- 开始菜单 -->
  <div id="start-menu" class="start-menu hidden">
    <!-- 用户信息区域 -->
    <div class="start-menu-user">
      <div class="user-avatar">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="currentColor">
          <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
        </svg>
      </div>
      <div class="user-info">
        <div class="user-name" id="start-menu-username">用户</div>
        <div class="user-status">已登录</div>
      </div>
      <button class="user-menu-btn" id="user-menu-btn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M6 9l6 6 6-6"/>
        </svg>
      </button>
    </div>
    
    <!-- 分隔线 -->
    <div class="start-menu-divider"></div>
    
    <!-- 常用应用区域 -->
    <div class="start-menu-apps">
      <div class="start-menu-section-title">所有应用</div>
      <div class="start-menu-app-list" id="start-menu-app-list">
        <!-- 动态填充 -->
      </div>
    </div>
    
    <!-- 分隔线 -->
    <div class="start-menu-divider"></div>
    
    <!-- 电源按钮区域 -->
    <div class="start-menu-power">
      <!-- 电源按钮 -->
      <div class="power-menu-container">
        <button class="power-btn-main" id="power-btn-main" title="电源选项">⏻</button>
        <!-- 电源弹出菜单 -->
        <div class="power-submenu hidden" id="power-submenu">
          <button class="power-submenu-item" id="start-menu-shutdown">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C17.99 7.86 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19 1.01-4.14 2.58-5.42L6.17 5.17C4.23 6.82 3 9.26 3 12c0 4.97 4.03 9 9 9s9-4.03 9-9c0-2.74-1.23-5.18-3.17-6.83z"/>
            </svg>
            <span>关机</span>
          </button>
          <button class="power-submenu-item" id="start-menu-restart">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
            </svg>
            <span>重新启动</span>
          </button>
          <button class="power-submenu-item" id="start-menu-shell">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M20 19V7H4v12h16m0-16a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h16m-7 14v-2h5v2h-5m-3.42-4L5 11l4-4 4 4-4.58 2.58"/>
            </svg>
            <span>Shell模式</span>
          </button>
        </div>
      </div>
    </div>
  </div>
  
  <script src="dashboard.js"></script>
</body>
</html>
