<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>新建用户</title>
  <link rel="stylesheet" href="winui-theme.css">
  <link rel="stylesheet" href="user-form.css">
  <link rel="stylesheet" href="win-combo.css">
</head>
<body>
  <!-- 新建用户独立窗口 -->
  <div class="titlebar">
    <span class="title-text">新建用户</span>
    <button class="close-btn" id="btn-close" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 12 12" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1" aria-hidden="true">
        <line x1="2" y1="2" x2="10" y2="10"/>
        <line x1="10" y1="2" x2="2" y2="10"/>
      </svg>
    </button>
  </div>

  <div class="content">
    <div class="field">
      <label class="field-label" for="f-username">用户名</label>
      <input class="win-textbox" id="f-username" type="text" autocomplete="off" spellcheck="false">
      <p class="hint">登录名，同时作为 home 目录名</p>
    </div>

    <div class="field">
      <label class="field-label" for="f-nickname">全名</label>
      <input class="win-textbox" id="f-nickname" type="text" autocomplete="off" spellcheck="false">
    </div>

    <div class="field">
      <label class="field-label" for="f-permi">权限</label>
      <div class="win-combo-host" id="f-permi-host"></div>
    </div>

    <div class="field">
      <div class="pwd-switch-row">
        <span class="field-label">密码设置</span>
        <button class="win-switch" id="pwd-switch" type="button" role="switch" aria-checked="false" aria-label="密码设置">
          <span class="win-switch-track"></span>
          <span class="win-switch-thumb"></span>
        </button>
      </div>
      <div class="pwd-section" id="pwd-section">
        <div class="pwd-section-inner">
        <div class="pwd-input-wrap">
          <input class="win-textbox" id="f-password" type="password" autocomplete="new-password" spellcheck="false" placeholder="输入新密码">
          <button class="pwd-reveal-btn" type="button" data-target="f-password" aria-label="显示密码" aria-pressed="false">
            <svg class="icon-on" viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
              <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
            </svg>
          </button>
        </div>
        <div class="pwd-input-wrap">
          <input class="win-textbox" id="f-password-repeat" type="password" autocomplete="new-password" spellcheck="false" placeholder="重复输入新密码">
          <button class="pwd-reveal-btn" type="button" data-target="f-password-repeat" aria-label="显示密码" aria-pressed="false">
            <svg class="icon-on" viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            </svg>
            <svg class="icon-off" viewBox="0 0 24 24" fill="currentColor" width="16" height="16" aria-hidden="true">
              <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
            </svg>
          </button>
          </div>
        </div>
      </div>
    </div>

    <div class="status hidden" id="form-status"></div>
  </div>

  <div class="footer">
    <button class="win-btn" id="btn-cancel" type="button">取消</button>
    <button class="win-btn AccentButtonStyle" id="btn-create" type="button">创建</button>
  </div>

  <script src="win-combo.js"></script>
  <script src="user-form.js"></script>
</body>
</html>
